@if (mobileTopHeaderVisibilityStatus()) {

<div
  [ngClass]="mobileTopHeaderVisibilityStatus() ? 'mobile-download-app-top-header' : 'mobile-download-app-without-top-header'">
  @if(independenceDayBanner?.isEnabled && isHomePage) {
    <div class="banner-independence-day">
      <img [src]="independenceDayBanner?.mWeb?.imageUrl" [alt]="independenceDayBanner?.mWeb?.onTopText">
      <span>{{independenceDayBanner?.mWeb?.onTopText}}</span>
    </div>
  } @else {
    <div class="cross-mobile-download-app" (click)="hideMobileTopHeader()">
      <span>X</span>
    </div>
    <div class="kb-symbol">
      <img src="/assets/icons/top-nav/KB-Symbol_icon.svg" alt="">
    </div>
    <div class="mobile-download-app-desc">
      <p class="mobile-download-app-desc-heading">iGot Karmayogi</p>
      <p class="mobile-download-app-desc-sub-heading">Download the mobile app</p>
    </div>
    <div class="flex-1 flex justify-end pr-4">
      <li class="download-app-chip-top-header" (click)="downloadApp()">
        <span>Download App </span>
      </li>
    </div>
  }
</div>
}
<div class="w-full">
  <ws-app-nav-bar-v2 [ngClass]="mobileTopHeaderVisibilityStatus() ? 'top-nav-bar':'top-nav-bar-without-mobile-header'"
    [mode]="'top'" [headerFooterConfigData]="headerFooterConfigData"
    [leftNavBarOpen]="leftNavBarOpen()"></ws-app-nav-bar-v2>
</div>
<!--
  NPS rating strip, restored from the retired ws-header (header.component.html:27, which rendered
  the same element with fromHeader=true). The strip is position:fixed to the bottom of the viewport,
  so sitting at the end of the header costs nothing.
  fromHeader MUST stay true: false selects .page-nps, which grid-layout.component.scss:922 sets to
  display:none !important - the strip would mount and stay invisible.
-->
<ws-widget-grid-layout *ngIf="isNpsEnabled" [widgetData]="npsWidgetData" [fromHeader]="true">
</ws-widget-grid-layout>
